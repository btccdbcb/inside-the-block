[project]
name = "itb-analysis"
version = "0.1.0"
description = "Analysis side of the Inside the Block study: collection, verification, statistics, simulation, figures"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "zstandard>=0.23",
    "cryptography>=43",
]

[project.scripts]
itb-analysis = "itb_analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["itb_analysis"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
